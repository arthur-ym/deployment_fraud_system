name: Deploy dev

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  publish-image:
    name: Publish Docker image
    runs-on: ubuntu-latest

    steps:
      - name: Check out tested commit
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ vars.DOCKERHUB_USERNAME }}/deployment-fraud-system
          tags: |
            type=raw,value=dev
            type=raw,value=sha-${{ github.sha }}

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    name: Deploy dev
    runs-on: ubuntu-latest
    needs: [publish-image]
    timeout-minutes: 30

    concurrency:
      group: fraud-api-dev
      cancel-in-progress: false

    environment: dev

    steps:
      - name: Check out tested commit
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Upload template and deploy stack
        env:
          ENV: dev
          TEMPLATE_BUCKET: ${{ vars.TEMPLATE_BUCKET }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          SHA: ${{ github.sha }}
          IMAGE: ${{ vars.DOCKERHUB_USERNAME }}/deployment-fraud-system
          KEY_NAME: ${{ vars.KEY_NAME }}
          ALARM_EMAIL: ${{ vars.ALARM_EMAIL }}
          INSTANCE_TYPE: ${{ vars.INSTANCE_TYPE }}
          SSH_LOCATION: ${{ vars.SSH_LOCATION }}
          API_ALLOWED_CIDR: ${{ vars.API_ALLOWED_CIDR }}
          DOCKERHUB_SECRET_ID: ${{ vars.DOCKERHUB_SECRET_ID }}
          PREDICTION_RETENTION_DAYS: ${{ vars.PREDICTION_RETENTION_DAYS }}
        run: |
          set -euo pipefail
          if [[ -z "${TEMPLATE_BUCKET}" || -z "${AWS_REGION}" || -z "${KEY_NAME}" ]]; then
            echo "TEMPLATE_BUCKET, AWS_REGION, and KEY_NAME must be set" >&2
            exit 1
          fi
          KEY="fraud-api/${ENV}/${SHA}/fraud-api.yaml"
          aws s3 cp infra/fraud-api.yaml "s3://${TEMPLATE_BUCKET}/${KEY}"
          OVERRIDES=(
            "Environment=${ENV}"
            "DockerImage=${IMAGE}:dev"
            "KeyName=${KEY_NAME}"
          )
          if [[ -n "${ALARM_EMAIL}" ]]; then
            OVERRIDES+=("AlarmEmail=${ALARM_EMAIL}")
          fi
          if [[ -n "${INSTANCE_TYPE}" ]]; then
            OVERRIDES+=("InstanceType=${INSTANCE_TYPE}")
          fi
          if [[ -n "${SSH_LOCATION}" ]]; then
            OVERRIDES+=("SSHLocation=${SSH_LOCATION}")
          fi
          if [[ -n "${API_ALLOWED_CIDR}" ]]; then
            OVERRIDES+=("ApiAllowedCidr=${API_ALLOWED_CIDR}")
          fi
          if [[ -n "${DOCKERHUB_SECRET_ID}" ]]; then
            OVERRIDES+=("DockerHubSecretId=${DOCKERHUB_SECRET_ID}")
          fi
          if [[ -n "${PREDICTION_RETENTION_DAYS}" ]]; then
            OVERRIDES+=("PredictionRetentionDays=${PREDICTION_RETENTION_DAYS}")
          fi
          aws cloudformation deploy \
            --stack-name "fraud-api-${ENV}" \
            --template-file infra/fraud-api.yaml \
            --capabilities CAPABILITY_IAM \
            --no-fail-on-empty-changeset \
            --parameter-overrides "${OVERRIDES[@]}"

      - name: Restart container on the existing instance
        env:
          ENV: dev
        run: |
          set -euo pipefail
          INSTANCE_ID=$(aws cloudformation describe-stacks \
            --stack-name "fraud-api-${ENV}" \
            --query "Stacks[0].Outputs[?OutputKey=='InstanceId'].OutputValue" \
            --output text)
          STATUS=""
          for _ in $(seq 1 30); do
            STATUS=$(aws ssm describe-instance-information \
              --filters "Key=InstanceIds,Values=${INSTANCE_ID}" \
              --query "InstanceInformationList[0].PingStatus" \
              --output text)
            if [[ "$STATUS" == "Online" ]]; then
              break
            fi
            sleep 10
          done
          if [[ "$STATUS" != "Online" ]]; then
            echo "Instance ${INSTANCE_ID} is not online in Systems Manager" >&2
            exit 1
          fi
          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "Restart fraud-api container" \
            --timeout-seconds 600 \
            --parameters 'commands=["/usr/local/bin/start-fraud-api.sh"]' \
            --query "Command.CommandId" \
            --output text)
          for _ in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$CMD_ID" \
              --instance-id "$INSTANCE_ID" \
              --query Status \
              --output text 2>/dev/null || true)
            case "$STATUS" in
              Success)
                exit 0
                ;;
              Failed|Cancelled|TimedOut)
                aws ssm get-command-invocation \
                  --command-id "$CMD_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --query "{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}" \
                  --output text
                exit 1
                ;;
            esac
            sleep 10
          done
          echo "Timed out waiting for the container restart on ${INSTANCE_ID}" >&2
          exit 1
