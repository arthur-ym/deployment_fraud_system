name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: read

jobs:
  publish-image:
    name: Publish Docker image
    runs-on: ubuntu-latest

    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository

    steps:
      - name: Check out tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ vars.DOCKERHUB_USERNAME }}/deployment-fraud-system
          tags: |
            type=raw,value=dev,enable=${{ github.event.workflow_run.head_branch == 'dev' }}
            type=raw,value=stg,enable=${{ github.event.workflow_run.head_branch == 'main' }}
            type=raw,value=${{ github.event.workflow_run.head_branch }},enable=${{ startsWith(github.event.workflow_run.head_branch, 'v') && contains(github.event.workflow_run.head_branch, '.') }}
            type=raw,value=sha-${{ github.event.workflow_run.head_sha }}

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    name: Deploy ${{ github.event.workflow_run.head_branch == 'main' && 'stg' || 'dev' }}
    runs-on: ubuntu-latest
    needs: [publish-image]
    timeout-minutes: 30

    concurrency:
      group: fraud-api-${{ github.event.workflow_run.head_branch == 'main' && 'stg' || 'dev' }}
      cancel-in-progress: false

    environment: ${{ github.event.workflow_run.head_branch == 'main' && 'staging' || 'dev' }}

    if: >-
      needs.publish-image.result == 'success' &&
      (
        github.event.workflow_run.head_branch == 'dev' ||
        github.event.workflow_run.head_branch == 'main'
      )

    steps:
      - name: Check out tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Upload template and deploy stack
        env:
          ENV: ${{ github.event.workflow_run.head_branch == 'main' && 'stg' || 'dev' }}
          TEMPLATE_BUCKET: ${{ vars.TEMPLATE_BUCKET }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          IMAGE: ${{ vars.DOCKERHUB_USERNAME }}/deployment-fraud-system
          KEY_NAME: ${{ vars.KEY_NAME }}
          ALARM_EMAIL: ${{ vars.ALARM_EMAIL }}
          INSTANCE_TYPE: ${{ vars.INSTANCE_TYPE }}
          SSH_LOCATION: ${{ vars.SSH_LOCATION }}
          API_ALLOWED_CIDR: ${{ vars.API_ALLOWED_CIDR }}
          DOCKERHUB_SECRET_ID: ${{ vars.DOCKERHUB_SECRET_ID }}
          PREDICTION_RETENTION_DAYS: ${{ vars.PREDICTION_RETENTION_DAYS }}
        run: |
          set -euo pipefail
          if [[ -z "${TEMPLATE_BUCKET}" || -z "${AWS_REGION}" || -z "${KEY_NAME}" ]]; then
            echo "TEMPLATE_BUCKET, AWS_REGION, and KEY_NAME must be set" >&2
            exit 1
          fi
          KEY="fraud-api/${ENV}/${SHA}/fraud-api.yaml"
          aws s3 cp infra/fraud-api.yaml "s3://${TEMPLATE_BUCKET}/${KEY}"
          TEMPLATE_URL="https://s3.${AWS_REGION}.amazonaws.com/${TEMPLATE_BUCKET}/${KEY}"
          OVERRIDES=(
            "Environment=${ENV}"
            "DockerImage=${IMAGE}:sha-${SHA}"
            "KeyName=${KEY_NAME}"
          )
          if [[ -n "${ALARM_EMAIL}" ]]; then
            OVERRIDES+=("AlarmEmail=${ALARM_EMAIL}")
          fi
          if [[ -n "${INSTANCE_TYPE}" ]]; then
            OVERRIDES+=("InstanceType=${INSTANCE_TYPE}")
          fi
          if [[ -n "${SSH_LOCATION}" ]]; then
            OVERRIDES+=("SSHLocation=${SSH_LOCATION}")
          fi
          if [[ -n "${API_ALLOWED_CIDR}" ]]; then
            OVERRIDES+=("ApiAllowedCidr=${API_ALLOWED_CIDR}")
          fi
          if [[ -n "${DOCKERHUB_SECRET_ID}" ]]; then
            OVERRIDES+=("DockerHubSecretId=${DOCKERHUB_SECRET_ID}")
          fi
          if [[ -n "${PREDICTION_RETENTION_DAYS}" ]]; then
            OVERRIDES+=("PredictionRetentionDays=${PREDICTION_RETENTION_DAYS}")
          fi
          aws cloudformation deploy \
            --stack-name "fraud-api-${ENV}" \
            --template-url "${TEMPLATE_URL}" \
            --capabilities CAPABILITY_IAM \
            --no-fail-on-empty-changeset \
            --parameter-overrides "${OVERRIDES[@]}"

  promote-production:
    name: Promote image to production
    runs-on: ubuntu-latest
    needs: [publish-image, deploy]
    timeout-minutes: 30

    concurrency:
      group: fraud-api-prod
      cancel-in-progress: false

    if: >-
      always() &&
      needs.publish-image.result == 'success' &&
      needs.deploy.result == 'success' &&
      github.event.workflow_run.head_branch == 'main'

    environment: production

    steps:
      - name: Check out tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Promote tested image to production
        env:
          IMAGE: ${{ vars.DOCKERHUB_USERNAME }}/deployment-fraud-system
          IMAGE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          docker buildx imagetools create \
            --tag "$IMAGE:prod" \
            "$IMAGE:sha-$IMAGE_SHA"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Upload template and deploy stack
        env:
          ENV: prod
          TEMPLATE_BUCKET: ${{ vars.TEMPLATE_BUCKET }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          IMAGE: ${{ vars.DOCKERHUB_USERNAME }}/deployment-fraud-system
          KEY_NAME: ${{ vars.KEY_NAME }}
          ALARM_EMAIL: ${{ vars.ALARM_EMAIL }}
          INSTANCE_TYPE: ${{ vars.INSTANCE_TYPE }}
          SSH_LOCATION: ${{ vars.SSH_LOCATION }}
          API_ALLOWED_CIDR: ${{ vars.API_ALLOWED_CIDR }}
          DOCKERHUB_SECRET_ID: ${{ vars.DOCKERHUB_SECRET_ID }}
          PREDICTION_RETENTION_DAYS: ${{ vars.PREDICTION_RETENTION_DAYS }}
        run: |
          set -euo pipefail
          if [[ -z "${TEMPLATE_BUCKET}" || -z "${AWS_REGION}" || -z "${KEY_NAME}" ]]; then
            echo "TEMPLATE_BUCKET, AWS_REGION, and KEY_NAME must be set" >&2
            exit 1
          fi
          KEY="fraud-api/${ENV}/${SHA}/fraud-api.yaml"
          aws s3 cp infra/fraud-api.yaml "s3://${TEMPLATE_BUCKET}/${KEY}"
          TEMPLATE_URL="https://s3.${AWS_REGION}.amazonaws.com/${TEMPLATE_BUCKET}/${KEY}"
          OVERRIDES=(
            "Environment=${ENV}"
            "DockerImage=${IMAGE}:sha-${SHA}"
            "KeyName=${KEY_NAME}"
          )
          if [[ -n "${ALARM_EMAIL}" ]]; then
            OVERRIDES+=("AlarmEmail=${ALARM_EMAIL}")
          fi
          if [[ -n "${INSTANCE_TYPE}" ]]; then
            OVERRIDES+=("InstanceType=${INSTANCE_TYPE}")
          fi
          if [[ -n "${SSH_LOCATION}" ]]; then
            OVERRIDES+=("SSHLocation=${SSH_LOCATION}")
          fi
          if [[ -n "${API_ALLOWED_CIDR}" ]]; then
            OVERRIDES+=("ApiAllowedCidr=${API_ALLOWED_CIDR}")
          fi
          if [[ -n "${DOCKERHUB_SECRET_ID}" ]]; then
            OVERRIDES+=("DockerHubSecretId=${DOCKERHUB_SECRET_ID}")
          fi
          if [[ -n "${PREDICTION_RETENTION_DAYS}" ]]; then
            OVERRIDES+=("PredictionRetentionDays=${PREDICTION_RETENTION_DAYS}")
          fi
          aws cloudformation deploy \
            --stack-name "fraud-api-${ENV}" \
            --template-url "${TEMPLATE_URL}" \
            --capabilities CAPABILITY_IAM \
            --no-fail-on-empty-changeset \
            --parameter-overrides "${OVERRIDES[@]}"