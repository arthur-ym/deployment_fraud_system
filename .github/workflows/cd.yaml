
name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: read

jobs:
  publish-image:
    name: Publish Docker image
    runs-on: ubuntu-latest

    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      (
        github.event.workflow_run.head_branch == 'dev' ||
        github.event.workflow_run.head_branch == 'staging' ||
        startsWith(github.event.workflow_run.head_branch, 'v')
      )

    steps:
      - name: Check out tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ vars.DOCKERHUB_USERNAME }}/deployment-fraud-system
          tags: |
            type=raw,value=dev,enable=${{ github.event.workflow_run.head_branch == 'dev' }}
            type=raw,value=stg,enable=${{ github.event.workflow_run.head_branch == 'staging' }}
            type=raw,value=prod,enable=${{ startsWith(github.event.workflow_run.head_branch, 'v') }}
            type=semver,pattern={{version}},enable=${{ startsWith(github.event.workflow_run.head_branch, 'v') }}
            type=sha,prefix=sha-,format=short

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
